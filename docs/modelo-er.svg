<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <style>
    .box { fill:#f8fafc; stroke:#2563eb; stroke-width:3; rx:12; }
    .title { fill:#1d4ed8; }
    .heading { fill:white; font:bold 22px sans-serif; }
    .text { fill:#111827; font:17px monospace; }
    .rel { fill:#374151; font:16px sans-serif; }
    .line { stroke:#475569; stroke-width:3; fill:none; marker-end:url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="white"/>
  <text x="600" y="42" text-anchor="middle" font="bold 30px sans-serif" fill="#111827">Modelo ER — Pulso TransMi</text>

  <rect class="box" x="55" y="100" width="350" height="260"/>
  <rect class="title" x="55" y="100" width="350" height="48" rx="12"/>
  <text class="heading" x="230" y="132" text-anchor="middle">STATION</text>
  <text class="text" x="80" y="185">PK  station_id VARCHAR</text>
  <text class="text" x="80" y="220">    station_name TEXT</text>
  <text class="text" x="80" y="255">    corridor TEXT</text>
  <text class="text" x="80" y="290">    latitude DECIMAL</text>
  <text class="text" x="80" y="325">    longitude DECIMAL</text>

  <rect class="box" x="425" y="415" width="350" height="240"/>
  <rect class="title" x="425" y="415" width="350" height="48" rx="12"/>
  <text class="heading" x="600" y="447" text-anchor="middle">OBSERVATION</text>
  <text class="text" x="450" y="500">PK  observed_at TIMESTAMPTZ</text>
  <text class="text" x="450" y="535">PK  station_id VARCHAR</text>
  <text class="text" x="450" y="570">FK  station_id → STATION</text>
  <text class="text" x="450" y="605">    demand INTEGER</text>

  <rect class="box" x="795" y="100" width="350" height="295"/>
  <rect class="title" x="795" y="100" width="350" height="48" rx="12"/>
  <text class="heading" x="970" y="132" text-anchor="middle">CONTEXT</text>
  <text class="text" x="820" y="185">PK  observed_at TIMESTAMPTZ</text>
  <text class="text" x="820" y="220">    rain_mm DECIMAL</text>
  <text class="text" x="820" y="255">    rain_forecast DECIMAL</text>
  <text class="text" x="820" y="290">    temperature_c DECIMAL</text>
  <text class="text" x="820" y="325">    temperature_forecast DECIMAL</text>
  <text class="text" x="820" y="360">    event_intensity DECIMAL</text>

  <path class="line" d="M230 360 L490 500"/>
  <text class="rel" x="315" y="410">1 : N — tiene</text>
  <path class="line" d="M795 360 L710 500"/>
  <text class="rel" x="720" y="420">por observed_at</text>

  <text x="600" y="695" text-anchor="middle" font="16px sans-serif" fill="#475569">OBSERVATION tiene clave compuesta (observed_at, station_id)</text>
</svg>
