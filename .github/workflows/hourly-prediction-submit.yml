name: Predict and Submit Pulso TransMi

on:
  schedule:
    - cron: "*/5 * * * *" # revisa cada 5 min (UTC) para no perder ciclos abiertos
  workflow_dispatch:        # ejecución manual desde GitHub Actions
  workflow_run:
    workflows: ["Sync Pulso TransMi to Supabase"]
    types: [completed]

concurrency:
  group: pulso-prediction-submit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  predict-and-submit:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install httpx pandas joblib scikit-learn

      - name: Check for an open forecast cycle
        id: cycle
        env:
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
        run: |
          for attempt in $(seq 1 10); do
            status=$(curl -sS \
              --connect-timeout 15 \
              --max-time 45 \
              --retry 3 \
              --retry-delay 5 \
              --retry-all-errors \
              -o cycle.json \
              -w "%{http_code}" \
              -H "Authorization: Bearer $PULSO_API_KEY" \
              "https://pulso-transmi.72-60-245-2.sslip.io/v1/forecast-cycles/current")

            if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
              echo "open=true" >> "$GITHUB_OUTPUT"
              echo "Ciclo abierto encontrado en el intento $attempt."
              exit 0
            elif [ "$status" != "404" ] || ! grep -q "no_open_cycle" cycle.json; then
              echo "La API respondió HTTP $status:"
              cat cycle.json
              exit 1
            fi

            echo "Intento $attempt/10: todavía no hay ciclo abierto; esperando 30 segundos."
            sleep 30
          done

          echo "open=false" >> "$GITHUB_OUTPUT"
          echo "No apareció un ciclo abierto durante la ventana de espera."

      - name: Generate and submit predictions
        if: steps.cycle.outputs.open == 'true'
        env:
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/run_prediction_pipeline.py

      - name: Publish the model trained by the prediction run
        if: steps.cycle.outputs.open == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: extratrees-model-${{ github.run_id }}
          path: artifacts/extratrees_model.joblib
          if-no-files-found: error
          retention-days: 14
