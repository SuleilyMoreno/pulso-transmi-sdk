name: Version Supabase Tables and Model

on:
  workflow_run:
    workflows: ["Sync Pulso TransMi to Supabase"]
    types: [completed]
  workflow_dispatch:

jobs:
  version:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install httpx pandas joblib scikit-learn

      - name: Export Supabase snapshot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/export_supabase_snapshot.py

      - name: Train model directly from Pulso TransMi API
        env:
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
        run: python scripts/train_extratrees_api.py

      - uses: actions/upload-artifact@v4
        with:
          name: supabase-snapshot-and-model-${{ github.run_number }}
          path: |
            snapshot/**
            artifacts/extratrees_model.joblib
          retention-days: 3
