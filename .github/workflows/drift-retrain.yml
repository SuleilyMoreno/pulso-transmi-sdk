name: Monitor Drift and Retrain
on:
  workflow_run:
    workflows: ["Predict and Submit Pulso TransMi"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monitor:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install httpx pandas joblib scikit-learn
      - name: Monitor drift and retrain
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
          DRIFT_ACCURACY_THRESHOLD: ${{ vars.DRIFT_ACCURACY_THRESHOLD || '0.85' }}
        run: python scripts/check_drift_and_retrain.py
      - uses: actions/upload-artifact@v4
        if: hashFiles('artifacts/extratrees_model.joblib') != ''
        with:
          name: extratrees-model-${{ github.run_number }}
          path: artifacts/extratrees_model.joblib
          retention-days: 3
