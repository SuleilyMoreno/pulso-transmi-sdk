name: Compare and Select Prediction Model

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install httpx pandas joblib scikit-learn
      - name: Compare models with current API data
        env:
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
        run: python scripts/evaluate_models_api.py
      - uses: actions/upload-artifact@v4
        with:
          name: selected-model-${{ github.run_number }}
          path: |
            artifacts/model_comparison_api.csv
            artifacts/best_model_api.joblib
          retention-days: 30
